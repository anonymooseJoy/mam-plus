<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic Store</title>
  <link rel="stylesheet" href="https://www.myanonamouse.net/site-ICGstation.css">
</head>
<body>
  <div class="mmUserStats">
    <span class="avatar"><a href="/u/999">me</a></span>
  </div>
  <div id="userMenu"></div>
  <ul><li>Status: (E-VIP)</li></ul>
  <div id="mainBody">
    <div id="currentBonusPoints">6,000</div>
    <div id="currentCheese">5</div>

    <div class="bonusRow vipStatusContent">
      <button value="4" title="4 weeks VIP for 5000 points">4 weeks</button>
      <button value="max" title="Max VIP for 5000 points">Max VIP</button>
    </div>

    <div class="bonusRow cheeseContent">
      <button value="cheese10" title="10 cheese">More Cheese</button>
    </div>

    <div class="bonusRow pointsContent">
      <button value="expensive" title="7000 points">Expensive Points Item</button>
      <button value="ok" title="1000 points">Affordable Points Item</button>
    </div>
  </div>
</body>
</html>
