<!DOCTYPE html>

</head>
<body>
  <div class="mmUserStats">
    <span class="avatar"><a href="/u/999">me</a></span>
  </div>
  <form id="torSearch">
    <input id="torTitle" type="text" value="space opera">
  </form>
  <div id="resetNewIcon"></div>
  <table id="ssr">
    <tr id="tdr1">
      <td>
        <div class="browseSnatched">Snatched</div>
        <a class="torTitle" href="/t/1">Synthetic Book One</a>
        <a class="directDownload" href="/download/1">Download</a>
        <a class="directDownloadFL" href="/download/1?fl">Download With Wedge</a>
        <div class="torFileTypes">
          <a href="#">epub</a>
          <a href="#">pdf</a>
        </div>
        <span class="torRowDesc">[space opera] | [aliens] &amp; [fleet battles]</span>
        <a id="torDeBookmark1" href="#">Bookmarked</a>
      </td>
    </tr>
    <tr id="tdr2">
      <td>
        <div class="browseSnatched">Snatched</div>
        <a class="torTitle" href="/t/2">Synthetic Book Two</a>
        <a class="directDownload" href="/download/2">Download</a>
        <div class="torFileTypes">
          <a href="#">m4b</a>
        </div>
        <span class="torRowDesc">[audio drama] | [science fiction]</span>
        <a id="torBookmark2" href="#">Not Bookmarked</a>
      </td>
    </tr>
  </table>
  <div id="massActions">
    <h2>Mass actions</h2>
    <button data-bmType="bookmarkAll" type="button">Bookmark All</button>
  </div>
</body>
</html>
