<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic QuickShout</title>
  <link rel="stylesheet" href="https://www.myanonamouse.net/site-ICGstation.css">
</head>
<body>
  <div id="fpShout" class="blockCon">
    <div id="shoutbox" class="tabs">
      <div id="sbf" class="sbf blockBody">
        <div class="blockBodyCon">
          <div id="sbid1">12:34:56 User123: Hello from synthetic QuickShout</div>
        </div>
      </div>
      <form id="sbform" method="get" target="sbox" name="shbox" aria-controls="sbf">
        <input type="hidden" id="cv" name="cv" value="sbf">
        <input
          id="shbox_text"
          class="sb_ac_u sb_ac_s"
          type="text"
          name="shbox_text"
          maxlength="1500"
          autocomplete="off"
        >
        <input name="send" type="submit" value=" Shout ">
        <img id="sbFullToggle" src="/view-fullscreen.svg" alt="view fullscreen">
      </form>
      <div id="sbNotifs"></div>
    </div>
    <div class="blockFoot"></div>
  </div>
</body>
</html>
